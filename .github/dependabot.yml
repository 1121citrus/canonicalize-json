# Dependabot configuration.
#
# Dependabot opens automated PRs to keep dependencies current.
# Each update group is checked weekly on Monday mornings (UTC).
#
# References:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  # Keeps action versions in .github/workflows/*.yml up to date.
  # Dependabot will also propose SHA-pinned updates, which is the recommended
  # hardening step for supply-chain security (SLSA / OpenSSF Scorecards).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"

  # ── Docker ──────────────────────────────────────────────────────────────────
  # Tracks the python:X.Y.Z-alpineX.Y base image pinned directly in the FROM
  # line.  When Dependabot proposes a bump, also update the pip ecosystem
  # entry's Alpine version comment if the Alpine component changes.
  #
  # Pre-release Python versions (alpha, beta, RC) are excluded: they are not
  # production-ready and introduce an unknown CVE surface.  Dependabot Docker
  # does not support semver pre-release filtering natively, so the known
  # pre-release minor versions are listed explicitly and updated as needed.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "python"
        versions: ["3.15.0a*", "3.15.0b*", "3.15.0rc*"]

  # ── Python (pip) ────────────────────────────────────────────────────────────
  # Keeps requirements.txt dependencies up to date.
  # After merging a Dependabot PR, regenerate hash pins per CONTRIBUTING.md:
  #   pip download --no-deps "jcs==<new-version>"
  #   pip hash jcs-<new-version>*.whl jcs-<new-version>.tar.gz
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "python"
