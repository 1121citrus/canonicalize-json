# Grype scan configuration for canonicalize-json.
#
# Only Critical/High findings block the build; Medium/Low are advisory only.

fail-on-severity: "high"

ignore:

  # python 3.15.2 — MEDIUM CVE-2026-116566; only fixed in 3.16.0.
  # No stable 3.15.x fix available as of 2026-11-15.  Remove when a 3.15.x
  # patch lands or when this image moves to Python 3.16.
  - vulnerability: CVE-2026-116566
    package:
      name: python
      type: binary

  # busybox 1.37.0-r31 — MEDIUM CVE-2025-60876; no fix in Alpine 3.24 yet.
  # `apk upgrade` runs at build time; remove when Alpine publishes a patch.
  - vulnerability: CVE-2025-60876
    package:
      name: busybox
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: busybox-binsh
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: ssl_client
      type: apk
