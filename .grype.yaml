# Grype scan configuration for canonicalize-json.
#
# Only Critical/High findings block the build; Medium/Low are advisory only.

fail-on-severity: "high"

ignore:

  # python — CRITICAL CVE-2026-6100; no fix available as of 2026-05-03.
  # Present in all current Python releases.  Remove when upstream ships a fix.
  - vulnerability: CVE-2026-6100

  # python 3.14.5 — CRITICAL CVE-2026-7210; only fixed in 3.15.0b2 (beta).
  # No stable 3.14.x fix available as of 2026-06-09.  Remove when a 3.14.x
  # patch lands or when this image moves to Python 3.15.
  - vulnerability: CVE-2026-7210
    package:
      name: python
      type: binary

  # python 3.14.1 — HIGH CVE-2026-3298; no fix available as of 2026-05-03.
  - vulnerability: CVE-2026-3298
    package:
      name: python
      type: binary

  # python 3.14.1 — HIGH CVE-2026-4786; no fix available as of 2026-05-03.
  - vulnerability: CVE-2026-4786
    package:
      name: python
      type: binary

  # sqlite-libs ≤3.49.2-r1 — HIGH CVE-2025-70873; no fix in Alpine 3.22 yet.
  # `apk upgrade` runs at build time; remove when Alpine publishes a patch.
  - vulnerability: CVE-2025-70873
    package:
      name: sqlite-libs
      type: apk

  # busybox 1.37.0-r20 — MEDIUM CVE-2025-60876; no fix in Alpine edge yet.
  # `apk upgrade` runs at build time; remove when Alpine publishes a patch.
  - vulnerability: CVE-2025-60876
    package:
      name: busybox
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: busybox-binsh
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: ssl_client
      type: apk
