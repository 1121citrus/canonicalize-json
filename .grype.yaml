# Grype scan configuration for canonicalize-json.
#
# Only Critical/High findings block the build; Medium/Low are advisory only.

fail-on-severity: "high"

ignore:

  # python 3.14.8 — MEDIUM CVE-2025-15367; only fixed in 3.15.0a6 (alpha).
  # No stable 3.14.x fix available as of 2026-10-28.  Remove when a 3.14.x
  # patch lands or when this image moves to Python 3.15.
  - vulnerability: CVE-2025-15367
    package:
      name: python
      type: binary

  # python 3.14.8 — MEDIUM CVE-2026-12345; only fixed in 3.15.0rc3 (rc).
  # No stable 3.14.x fix available as of 2026-10-28.  Remove when a 3.14.x
  # patch lands or when this image moves to Python 3.15.
  - vulnerability: CVE-2026-12345
    package:
      name: python
      type: binary

  # busybox 1.37.0-r31 — MEDIUM CVE-2025-60876; no fix in Alpine 3.24 yet.
  # `apk upgrade` runs at build time; remove when Alpine publishes a patch.
  - vulnerability: CVE-2025-60876
    package:
      name: busybox
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: busybox-binsh
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: ssl_client
      type: apk
